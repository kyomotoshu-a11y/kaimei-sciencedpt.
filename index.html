<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>理科器具管理システム</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    #auth-screen {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #f4f6f8;
      z-index: 9999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .auth-card {
      background: #ffffff;
      padding: 32px 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    .auth-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: bold;
      color: #1e293b;
    }
    .auth-desc {
      margin: 0 0 24px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }
    .auth-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 16px;
      font-size: 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 12px;
      text-align: center;
      outline: none;
      transition: border-color 0.2s;
    }
    .auth-input:focus {
      border-color: #0284c7;
    }
    .auth-error {
      display: none;
      color: #ef4444;
      font-size: 12px;
      margin: 0 0 14px;
      font-weight: bold;
    }
    .auth-btn {
      width: 100%;
      padding: 13px;
      background-color: #0284c7;
      color: #ffffff;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      cursor: pointer;
    }
    .auth-btn:active {
      background-color: #0369a1;
    }
  </style>
</head>
<body>

  <!-- ロック画面 -->
  <div id="auth-screen">
    <div class="auth-card">
      <div style="font-size: 36px; margin-bottom: 12px;">🔒</div>
      <h2 class="auth-title">理科器具管理システム</h2>
      <p class="auth-desc">閲覧するには理科室の合言葉を入力してください</p>
      
      <input type="password" id="passcode-input" class="auth-input" placeholder="合言葉を入力" onkeypress="if(event.key==='Enter') submitPasscode()">
      <p id="auth-error" class="auth-error">合言葉が正しくありません</p>
      
      <button class="auth-btn" onclick="submitPasscode()">認証して開く</button>
    </div>
  </div>

  <script>
    const GAS_BASE_URL = "https://script.google.com/macros/s/AKfycbzlOBvfTDeFLeLvr1pcKyC__t0n-cbQ1Rbbuf9Hmk-iBqj6miLxM4-NUdZfvFnOZilr/exec";
    const STORAGE_KEY = "kaimei_lab_pw_token";

    function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      
      // resetパラメータ付きで戻された場合は保存済みパスワードを削除して再入力画面へ
      if (urlParams.get('reset') === '1') {
        localStorage.removeItem(STORAGE_KEY);
        urlParams.delete('reset');
        const cleanSearch = urlParams.toString();
        const newUrl = window.location.pathname + (cleanSearch ? '?' + cleanSearch : '');
        window.history.replaceState({}, '', newUrl);
        
        document.getElementById('auth-error').style.display = 'block';
        document.getElementById('auth-screen').style.display = 'flex';
        return;
      }

      const savedPw = localStorage.getItem(STORAGE_KEY);
      if (savedPw) {
        loadGasIframe(savedPw);
      } else {
        document.getElementById('auth-screen').style.display = 'flex';
      }
    }

    function submitPasscode() {
      const inputEl = document.getElementById('passcode-input');
      const entered = inputEl.value.trim();
      if (!entered) return;

      localStorage.setItem(STORAGE_KEY, entered);
      document.getElementById('auth-screen').style.display = 'none';
      loadGasIframe(entered);
    }

    function loadGasIframe(passcode) {
      const oldFrame = document.querySelector('iframe');
      if (oldFrame) oldFrame.remove();

      const urlParams = new URLSearchParams(window.location.search);
      urlParams.set('pw', passcode);

      const targetUrl = `${GAS_BASE_URL}?${urlParams.toString()}`;

      const iframe = document.createElement('iframe');
      iframe.src = targetUrl;
      iframe.allow = "fullscreen";
      document.body.appendChild(iframe);
    }

    // postMessageでのリセット通知受信
    window.addEventListener('message', function(event) {
      if (event.data === 'AUTH_FAILED') {
        localStorage.removeItem(STORAGE_KEY);
        const oldFrame = document.querySelector('iframe');
        if (oldFrame) oldFrame.remove();
        
        document.getElementById('passcode-input').value = '';
        document.getElementById('auth-error').style.display = 'block';
        document.getElementById('auth-screen').style.display = 'flex';
      }
    });

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
